{% extends "payments/base.html" %}
{% block title %}Refund Not Allowed {% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm rounded-4 border-danger">
      <div class="card-body p-4">
        <h1 class="h5 fw-bold">Refund not allowed</h1>
        <p class="text-muted mb-4">
          Only <strong>successful</strong> transactions can be refunded in this prototype.
        </p>

        <div class="d-grid gap-2">
          <a class="btn btn-outline-secondary btn-lg" href="{% url 'transactions' %}">Back to Transactions</a>
          <a class="btn btn-primary btn-lg" href="{% url 'new_sale' %}">New Sale</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
