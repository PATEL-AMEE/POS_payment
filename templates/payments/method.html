{% extends "payments/base.html" %}
{% block title %}Payment Method {% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h5 fw-bold m-0">Choose Payment Method</h1>
          <div class="amount-big">£{{ amount }}</div>
        </div>

        <form method="post" class="d-grid gap-3">
          {% csrf_token %}
          <button class="btn btn-primary btn-lg btn-lg-merchant" name="method" value="card" type="submit">
            💳 Pay by Card
          </button>

          <button class="btn btn-outline-primary btn-lg btn-lg-merchant" name="method" value="qr" type="submit">
            📱 Pay by QR
          </button>

          <a class="btn btn-outline-secondary btn-lg btn-lg-merchant" href="{% url 'new_sale' %}">
            Back
          </a>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
