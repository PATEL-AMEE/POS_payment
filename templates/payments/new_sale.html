{% extends "payments/base.html" %}
{% block title %}New Sale {% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-4">
        <h1 class="h5 fw-bold mb-3">Enter Amount</h1>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <input name="amount" id="amountInput" class="form-control form-control-lg text-center"
                   placeholder="0.00" inputmode="decimal" step="0.01" required>
          </div>

          <div class="d-flex gap-2 flex-wrap mb-3">
            <button class="btn btn-outline-secondary" type="button" onclick="setAmount('5.00')">£5</button>
            <button class="btn btn-outline-secondary" type="button" onclick="setAmount('10.00')">£10</button>
            <button class="btn btn-outline-secondary" type="button" onclick="setAmount('20.00')">£20</button>
            <button class="btn btn-outline-secondary" type="button" onclick="setAmount('50.00')">£50</button>
          </div>

          <div class="d-grid gap-2">
            <button class="btn btn-primary btn-lg btn-lg-merchant" type="submit">Continue</button>
            <a class="btn btn-outline-danger btn-lg btn-lg-merchant" href="{% url 'home' %}">Cancel</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function setAmount(v) {
    document.getElementById("amountInput").value = v;
  }
</script>
{% endblock %}
