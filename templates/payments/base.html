<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}POS Payment{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .rounded-4 { border-radius: 1rem !important; }
    .btn-lg-merchant { padding: 1rem 1.25rem; font-size: 1.1rem; }
    .amount-big { font-size: 2.25rem; font-weight: 800; }
    .qr-box { height: 260px; }
  </style>
</head>

<body class="bg-light">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">POS Payment</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'transactions' %}">Transactions</a>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
